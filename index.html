<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Base composites</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f5f4;--card:#fff;--ink:#1c2528;--mute:#5d6a6e;--line:#dbe1e0;--acc:#1d6b57;--accink:#fff;--soft:#e4efeb;--warn:#a5691a;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141a1c;--card:#1b2326;--ink:#e6ecea;--mute:#94a3a6;--line:#2a3639;--acc:#4db89a;--accink:#0e1a17;--soft:#1f3a33;--warn:#e0b25a}}
:root[data-theme="dark"]{--bg:#141a1c;--card:#1b2326;--ink:#e6ecea;--mute:#94a3a6;--line:#2a3639;--acc:#4db89a;--accink:#0e1a17;--soft:#1f3a33;--warn:#e0b25a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif}
header{display:flex;flex-wrap:wrap;align-items:center;gap:12px 24px;padding:16px 20px;background:var(--card);border-bottom:1px solid var(--line)}
h1{font-size:18px;margin:0;font-weight:700;letter-spacing:-.01em}
nav{display:flex;gap:4px;flex:1;flex-wrap:wrap}
nav button{background:none;border:0;padding:8px 14px;border-radius:8px;color:var(--mute);font:inherit;font-weight:500;cursor:pointer}
nav button.on{background:var(--soft);color:var(--acc);font-weight:600}
main{max-width:1100px;margin:0 auto;padding:20px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.btn,.pri{border:1px solid var(--line);background:var(--card);padding:8px 14px;border-radius:8px;font-weight:500}
.pri{background:var(--acc);color:var(--accink);border-color:var(--acc);font-weight:600}
.danger{color:#b3392f;border-color:#b3392f55}
input,select,textarea{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%}
:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
.bar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.bar input[type=search]{flex:1;min-width:160px;width:auto}.bar select{width:auto}
.tw{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
th{font-weight:600;color:var(--mute);font-size:13px;white-space:nowrap}
tbody tr:last-child td,tbody tr:last-child th{border-bottom:0}
tr.click{cursor:pointer}tr.click:hover{background:var(--soft)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:7px}
.tag{font-size:12px;padding:2px 8px;border-radius:99px;background:var(--soft);color:var(--acc);font-weight:600;margin-left:6px}
.tag.w{background:transparent;border:1px solid var(--warn);color:var(--warn)}
.hint{color:var(--mute);margin:0 0 14px}
.empty{padding:28px;text-align:center;color:var(--mute)}
.mx td{min-width:170px}
.chip{display:block;padding:5px 8px;margin-bottom:5px;border:1px solid var(--line);border-radius:8px;cursor:pointer;font-size:13px;background:var(--bg)}
.chip:hover{border-color:var(--acc)}
.add{border:1px dashed var(--line);background:none;border-radius:8px;width:100%;padding:3px;color:var(--mute)}
.add:hover{border-color:var(--acc);color:var(--acc)}
.barv{height:8px;background:var(--soft);border-radius:4px;min-width:90px}.barv i{display:block;height:100%;background:var(--acc);border-radius:4px}
.barv.r i{background:var(--ink)}
.sec{margin-bottom:22px}.sec h2{font-size:15px;margin:0 0 8px}
.pills{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.pill{display:inline-flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:99px;padding:4px 6px 4px 12px}
.pill button{border:0;background:none;color:var(--mute);padding:0 4px;font-size:16px;line-height:1}
.row{display:flex;gap:8px}.row input{flex:1}
dialog{width:min(760px,94vw);max-height:92vh;border:1px solid var(--line);border-radius:14px;background:var(--card);color:var(--ink);padding:0;overflow:auto}
dialog::backdrop{background:#0008}
.dh{padding:16px 20px;border-bottom:1px solid var(--line);font-weight:700;font-size:16px}
.db{padding:16px 20px}
.g{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.g .full{grid-column:1/-1}
label{display:block;font-size:13px;color:var(--mute);font-weight:500}
label input,label select,label textarea{margin-top:4px;color:var(--ink);font-size:15px}
.chk{display:flex;gap:8px;align-items:center;color:var(--ink);font-size:14px}.chk input{width:auto;margin:0}
.df{display:flex;gap:8px;flex-wrap:wrap;padding:14px 20px;border-top:1px solid var(--line);position:sticky;bottom:0;background:var(--card)}
.df .sp{flex:1}
.rt input,.rt select{padding:6px 8px;min-width:70px}.rt td{padding:6px 8px}
#err{color:#b3392f;font-size:13px;align-self:center}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;overflow-x:auto}
.lg{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;margin:0 0 8px}.lg i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:6px}
svg text{fill:currentColor}
.sync{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:10px 20px;background:var(--soft);border-bottom:1px solid var(--line);font-size:14px}.sync[hidden]{display:none}
.ro .add,.ro .newp{display:none}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;display:none;z-index:99;font-size:14px}
@media(max-width:560px){.g{grid-template-columns:1fr}main{padding:14px}}
</style>
</head>
<body>
<header>
  <h1>Base composites</h1><span id="st" style="font-size:12px;color:var(--mute)"></span>
  <nav id="nav"></nav>
  <button class="btn" onclick="exportXLSX()">Exporter vers Excel (.xlsx)</button>
</header>
<div id="sync" class="sync" hidden></div>
<main id="app"></main>
<dialog id="dlg"></dialog>
<div id="toast" role="status"></div>
<input type="file" id="imp" accept=".json" hidden>
<script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js"></script>
<script>
let shared=false,ready=false,ro=false,busy=0,last={},cfgLast='',R={c:undefined,p:undefined};
const KEY='composites-db-v1';
const uid=()=>Math.random().toString(36).slice(2,9);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $=s=>document.querySelector(s);
const opts=(l,v)=>l.map(x=>`<option${x===v?' selected':''}>${esc(x)}</option>`).join('');
const COL=['#8a979b','#d19a2e','#2e9e6b','#4a7fc1'];
const DEF={cfg:{
 fibres:['Carbone vierge (référence)','Carbone recyclé','Lin','Chanvre'],
 resines:['Époxy de référence','Biosourcée (SwissComposites)','Elium'],
 procedes:['Infusion sous vide'],
 statuts:['À fabriquer','Fabriquée','Testée'],
 materiaux3d:['PLA','PETG','ABS','PA12','PA12-CF','TPU'],procedes3d:['FDM','SLA','SLS'],motifs:['Grille','Gyroïde','Nid d’abeille','Triangles'],orients:['À plat (XY)','Sur la tranche (XZ)','Debout (Z)'],
 props:[
  {id:'p1',nom:'Résistance en traction',unite:'MPa',norme:'ASTM D3039'},
  {id:'p2',nom:'Module en traction',unite:'GPa',norme:'ASTM D3039'},
  {id:'p3',nom:'Résistance en flexion',unite:'MPa',norme:'ASTM D7264'},
  {id:'p4',nom:'Module en flexion',unite:'GPa',norme:'ASTM D7264'},
  {id:'p5',nom:'Amortissement tan δ (DMA)',unite:'-',norme:'ISO 6721-5'},
  {id:'p6',nom:"Absorption d'humidité",unite:'%',norme:''}]},
 plaques:[
  {id:'a1',nom:'Référence carbone',fibre:'Carbone vierge (référence)',resine:'Époxy de référence',layup:'3 plis CF 200 g/m² 3k twill',procede:'Infusion sous vide',vfv:'50',vf:'',poro:'',ep:'',date:'',statut:'À fabriquer',ref:true,notes:'Épaisseur théorique ≈ 0,67 mm',res:{}},
  {id:'a2',nom:'Lin + PowerRibs',fibre:'Lin',resine:'Époxy de référence',layup:'2 plis ampliTex™ 245 g/m² twill 2/2 + 1 couche PowerRibs™ 235 g/m²',procede:'Infusion sous vide',vfv:'33',vf:'',poro:'',ep:'',date:'',statut:'À fabriquer',ref:false,notes:'Épaisseur théorique ≈ 1,47 mm',res:{}}]};
let S;try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}
if(!S||!S.cfg||!S.plaques)S=structuredClone(DEF);
const norm=()=>{for(const k in DEF.cfg)if(S.cfg[k]===undefined)S.cfg[k]=structuredClone(DEF.cfg[k]);if(!S.seed3d){S.seed3d=1;if(!S.plaques.some(p=>p.type==='3d'))S.plaques.push({id:'a3',nom:'Plaque test impression 3D',type:'3d',fibre:'',resine:'',layup:'',procede:'',vfv:'',vf:'',poro:'',ep:'',date:'',statut:'À fabriquer',ref:false,notes:'À compléter : matériau et paramètres d’impression',res:{},imp:{materiau:'PLA',procede3d:'FDM',orientation:'À plat (XY)'}})}};norm();
const store=()=>{if(shared)return;try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const save=()=>{S.dirty=true;store();if(shared)push()};
let tab='plaques',curProp=null;
const TABS=[['plaques','Plaques'],['matrice','Matrice'],['resultats','Résultats'],['graphes','Graphiques'],['co2','Empreinte carbone'],['params','Paramètres']];
const dot=s=>`<span class="dot" style="background:${COL[Math.max(0,S.cfg.statuts.indexOf(s))%4]}"></span>`;
function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(t._t);t._t=setTimeout(()=>t.style.display='none',2800)}
function render(){
 $('#nav').innerHTML=TABS.map(([k,l])=>`<button class="${k===tab?'on':''}" onclick="tab='${k}';render()">${l}</button>`).join('');
 ({plaques:vPlaques,matrice:()=>{vMatrice();m3()},resultats:vRes,graphes:vGraph,co2:vCo2,params:vParams})[tab]();
}
/* ---------- Plaques ---------- */
function vPlaques(){
 $('#app').innerHTML=`<div class="bar"><input id="q" type="search" placeholder="Rechercher une plaque, une fibre…"><select id="fs"><option value="">Tous les statuts</option>${opts(S.cfg.statuts)}</select><select id="ft"><option value="">Tous les types</option><option value="composite">Composites</option><option value="3d">Impression 3D</option></select><button class="pri newp" onclick="edit()">Nouvelle plaque</button></div>
 <div class="tw"><table><thead><tr><th>Plaque</th><th>Type</th><th>Matériau</th><th>Paramètres clés</th><th>Épaisseur (mm)</th><th>Statut</th></tr></thead><tbody id="rows"></tbody></table></div>`;
 $('#q').oninput=$('#fs').onchange=$('#ft').onchange=rows;rows();
}
const tl=p=>p.type==='3d'?'Impression 3D':'Composite',mu=t=>`<br><span style="color:var(--mute);font-size:13px">${t}</span>`;
function mat(p){const i=p.imp||{};return p.type==='3d'?esc(i.materiau)+mu(esc(i.procede3d)):esc(p.fibre)+mu(esc(p.resine))}
function cles(p){const i=p.imp||{};if(p.type==='3d')return esc([i.couche&&'couche '+i.couche+' mm',i.remplissage&&'remplissage '+i.remplissage+' %',i.orientation].filter(Boolean).join(' · '))||'—';return p.vf?'Vf '+esc(p.vf)+' %':p.vfv?'Vf visée '+esc(p.vfv)+' %':'—'}
function rows(){
 const q=$('#q').value.toLowerCase(),st=$('#fs').value,ty=$('#ft').value;
 const l=S.plaques.filter(p=>(!st||p.statut===st)&&(!ty||(p.type||'composite')===ty)&&(!q||[p.nom,p.fibre,p.resine,p.layup,p.notes,JSON.stringify(p.imp||{})].join(' ').toLowerCase().includes(q)));
 $('#rows').innerHTML=l.length?l.map(p=>`<tr class="click" onclick="edit('${p.id}')"><td><b>${esc(p.nom)}</b>${p.ref?'<span class="tag">référence</span>':''}<div style="color:var(--mute);font-size:13px">${esc(p.layup)}</div></td><td>${tl(p)}</td><td>${mat(p)}</td><td>${cles(p)}</td><td>${esc(p.ep)||'—'}</td><td style="white-space:nowrap">${dot(p.statut)}${esc(p.statut)}</td></tr>`).join(''):`<tr><td colspan="6" class="empty">Aucune plaque. Clique sur « Nouvelle plaque » pour commencer.</td></tr>`;
}
function tg(v){document.querySelectorAll('.gc').forEach(e=>e.style.display=v==='3d'?'none':'contents');$('#g3').style.display=v==='3d'?'contents':'none'}
function edit(id,pre){
 if(ro){toast('Lecture seule : tu n’as pas le droit de modifier cette base.');return}
 const c=S.cfg;
 const p=id?S.plaques.find(x=>x.id===id):{nom:'',fibre:'',resine:'',layup:'',procede:c.procedes[0]||'',vfv:'',vf:'',poro:'',ep:'',date:'',statut:c.statuts[0]||'',ref:false,notes:'',res:{},...pre};
 p.type=p.type||'composite';p.imp=p.imp||{};
 const im=(n,l,list)=>list?`<label>${l}<select name="i_${n}"><option value=""></option>${opts(list,p.imp[n])}</select></label>`:`<label>${l}<input name="i_${n}" type="number" step="any" value="${esc(p.imp[n])}"></label>`;
 const f=(n,l,t='text',x='')=>`<label>${l}<input name="${n}" type="${t}" value="${esc(p[n])}" ${x}></label>`;
 const s=(n,l,list)=>`<label>${l}<select name="${n}"><option value=""></option>${opts(list,p[n])}</select></label>`;
 const rt=c.props.map(pr=>{const r=p.res[pr.id]||{};
  return `<tr><td>${esc(pr.nom)} <span style="color:var(--mute)">(${esc(pr.unite)})</span></td><td><input name="m_${pr.id}" type="number" step="any" value="${r.m??''}"></td><td><input name="sd_${pr.id}" type="number" step="any" value="${r.sd??''}"></td><td><input name="n_${pr.id}" type="number" min="0" value="${r.n??''}"></td><td><select name="s_${pr.id}">${opts(['Essai interne','Fiche technique'],r.src)}</select></td></tr>`}).join('');
 $('#dlg').innerHTML=`<div class="dh">${id?'Modifier la plaque':'Nouvelle plaque'}</div><div class="db">
 <div class="g">${f('nom','Nom de la plaque *','text','class="full"').replace('<label>','<label class="full">')}
 <label class="full">Type d'échantillon<select name="type" onchange="tg(this.value)"><option value="composite"${p.type!=='3d'?' selected':''}>Composite</option><option value="3d"${p.type==='3d'?' selected':''}>Impression 3D</option></select></label>
 <div class="gc" style="display:${p.type==='3d'?'none':'contents'}">${s('fibre','Fibre',c.fibres)}${s('resine','Résine',c.resines)}
 <label class="full">Layup (empilement)<input name="layup" value="${esc(p.layup)}" placeholder="ex. 3 plis CF 200 g/m² 3k twill"></label>
 ${s('procede','Procédé',c.procedes)}</div>
 <div id="g3" style="display:${p.type==='3d'?'contents':'none'}">${im('materiau','Matériau',c.materiaux3d)}${im('procede3d','Procédé d’impression',c.procedes3d)}${im('couche','Hauteur de couche (mm)')}${im('remplissage','Remplissage (%)')}${im('motif','Motif de remplissage',c.motifs)}${im('orientation','Orientation d’impression',c.orients)}${im('buse','Température buse (°C)')}${im('vitesse','Vitesse d’impression (mm/s)')}</div>
 ${s('statut','Statut',c.statuts)}
 <div class="gc" style="display:${p.type==='3d'?'none':'contents'}">${f('vfv','Vf visée (%)','number','step="any"')}${f('vf','Vf mesurée (%)','number','step="any"')}</div>
 ${f('poro','Porosité (%)','number','step="any"')}${f('ep','Épaisseur mesurée (mm)','number','step="any"')}
 ${f('date','Date de fabrication','date')}
 <label class="chk"><input type="checkbox" name="ref" ${p.ref?'checked':''}>Plaque de référence (base du calcul en %)</label>
 <label class="full">Notes<textarea name="notes" rows="2">${esc(p.notes)}</textarea></label></div>
 <h3 style="font-size:14px;margin:18px 0 6px">Empreinte carbone <span style="color:var(--mute);font-weight:400">(kg CO₂e par ${esc(c.uf||UF0)})</span></h3>
 <div class="g">${CO.map(([k,l])=>`<label>${l}<input name="co_${k}" type="number" step="any" value="${p.co2&&p.co2[k]!=null?p.co2[k]:''}"></label>`).join('')}<label class="full">Source des données (EcoInvent, EPD…)<input name="co_src" value="${esc(p.co2&&p.co2.src)}"></label></div>
 <h3 style="font-size:14px;margin:18px 0 6px">Résultats d'essais</h3>
 <div class="tw"><table class="rt"><thead><tr><th>Propriété</th><th>Moyenne</th><th>Écart-type</th><th>Nb éprouvettes</th><th>Source</th></tr></thead><tbody>${rt||'<tr><td class="empty" colspan="5">Aucune propriété définie (voir Paramètres).</td></tr>'}</tbody></table></div></div>
 <div class="df"><button class="pri" onclick="saveP('${id||''}')">Enregistrer</button><button class="btn" onclick="dlg.close()">Annuler</button><span id="err"></span><span class="sp"></span>
 ${id?`<button class="btn" onclick="dup('${id}')">Dupliquer</button><button class="btn danger" onclick="arm(this,()=>delP('${id}'))">Supprimer</button>`:''}</div>`;
 $('#dlg').showModal();
}
function saveP(id){
 const d={};document.querySelectorAll('#dlg [name]').forEach(e=>d[e.name]=e.type==='checkbox'?e.checked:e.value);
 if(!d.nom.trim()){$('#err').textContent='Donne un nom à la plaque.';return}
 const res={},num=v=>v===''||v==null?null:+v;
 S.cfg.props.forEach(pr=>{const m=d['m_'+pr.id],sd=d['sd_'+pr.id],n=d['n_'+pr.id];
  if(m!==''||sd!==''||n!=='')res[pr.id]={m:num(m),sd:num(sd),n:num(n),src:d['s_'+pr.id]}});
 const p={id:id||uid(),ts:id?((S.plaques.find(x=>x.id===id)||{}).ts||0):Date.now(),nom:d.nom.trim(),fibre:d.fibre,resine:d.resine,layup:d.layup,procede:d.procede,vfv:d.vfv,vf:d.vf,poro:d.poro,ep:d.ep,date:d.date,statut:d.statut,ref:d.ref,notes:d.notes,res,type:d.type,imp:d.type==='3d'?Object.fromEntries(Object.entries(d).filter(([k])=>k.startsWith('i_')).map(([k,v])=>[k.slice(2),v])):{},co2:(()=>{const o={src:d.co_src};CO.forEach(([k])=>o[k]=d['co_'+k]===''?null:+d['co_'+k]);return o})()};
 if(p.type==='3d')Object.assign(p,{fibre:'',resine:'',layup:'',procede:'',vfv:'',vf:''});
 if(p.ref)S.plaques.forEach(x=>{if((x.type||'composite')===p.type)x.ref=false});
 if(id)S.plaques[S.plaques.findIndex(x=>x.id===id)]=p;else S.plaques.push(p);
 save();$('#dlg').close();render();toast('Plaque enregistrée');
}
function dup(id){const p=structuredClone(S.plaques.find(x=>x.id===id));p.id=uid();p.ts=Date.now();p.nom+=' (copie)';p.ref=false;S.plaques.push(p);save();$('#dlg').close();render();toast('Plaque dupliquée')}
function delP(id){S.plaques=S.plaques.filter(x=>x.id!==id);save();$('#dlg').close();render();toast('Plaque supprimée')}
function arm(b,fn){if(b.dataset.a){fn();return}b.dataset.a=1;b.textContent='Confirmer ?';setTimeout(()=>{b.dataset.a='';b.textContent=b.dataset.t||'Supprimer'},3000)}
/* ---------- Matrice ---------- */
function vMatrice(){
 const c=S.cfg;
 $('#app').innerHTML=`<p class="hint">Une case = une combinaison fibre × résine. Clique sur + pour créer la plaque correspondante.</p>
 <div class="tw"><table class="mx"><thead><tr><th>Fibre \\ Résine</th>${c.resines.map(r=>`<th>${esc(r)}</th>`).join('')}</tr></thead><tbody>
 ${c.fibres.map((f,i)=>`<tr><th>${esc(f)}</th>${c.resines.map((r,j)=>`<td>${S.plaques.filter(p=>p.fibre===f&&p.resine===r).map(p=>`<a class="chip" onclick="edit('${p.id}')">${dot(p.statut)}${esc(p.nom)}</a>`).join('')}<button class="add" title="Nouvelle plaque" onclick="addMx(${i},${j})">+</button></td>`).join('')}</tr>`).join('')}
 </tbody></table></div>`;
}
function addMx(i,j){edit(0,{fibre:S.cfg.fibres[i],resine:S.cfg.resines[j],ref:false})}
function m3(){const c=S.cfg;

/* ---------- Base partagée (claude.ai) ---------- */
const J=o=>JSON.stringify(o,(k,v)=>v&&typeof v==='object'&&!Array.isArray(v)?Object.fromEntries(Object.entries(v).sort(([a],[b])=>a<b?-1:a>b?1:0)):v);
const cl=o=>JSON.parse(JSON.stringify(o));
let chain=Promise.resolve(),H=null;
function setRO(){ro=true;document.body.classList.add('ro');$('#st').textContent='● Partagé · lecture seule';toast('Lecture seule : tu n’as pas le droit de modifier cette base.')}
function applyRemote(){
 if(R.c===undefined||R.p===undefined)return;
 if(!ready){ready=true;if(!R.c.exists&&!R.p.length&&!ro){last={};cfgLast='';push();return}}
 if(R.c.exists)S.cfg=cl(R.c.data());
 S.plaques=R.p.map(x=>({...cl(x.data()),id:x.id})).sort((a,b)=>(a.ts||0)-(b.ts||0)||String(a.nom).localeCompare(String(b.nom)));
 S.seed3d=1;norm();
 last={};S.plaques.forEach(p=>last[p.id]=J(p));cfgLast=J(S.cfg);
 const a=document.activeElement;if(!(a&&a.closest&&a.closest('#app input,#app textarea,#app select')))render();
}
function push(){
 if(!ready||!H)return;
 const ops=[];
 const cj=J(S.cfg);if(cj!==cfgLast){const d=JSON.parse(cj);ops.push(()=>H.doc('base/cfg').set(d));cfgLast=cj}
 const cur={};S.plaques.forEach(p=>cur[p.id]=J(p));
 for(const id in cur)if(last[id]!==cur[id]){const d=JSON.parse(cur[id]);delete d.id;ops.push(()=>H.doc('plaques/'+id).set(d))}
 for(const id in last)if(!(id in cur))ops.push(()=>H.doc('plaques/'+id).delete());
 last=cur;
 if(!ops.length)return;
 busy++;
 chain=chain.then(async()=>{for(const o of ops){try{await o()}catch(e){if(e&&e.code==='invalid_argument')setRO();else toast('Enregistrement impossible : '+(e&&e.message));break}}}).then(()=>{busy--;if(!busy)applyRemote()});
}
